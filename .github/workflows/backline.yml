name: Backline

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: backline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config: .backline.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          