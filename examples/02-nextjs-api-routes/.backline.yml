version: 1

target:
  base_url: "http://localhost:3000"
  wait_for:
    path: /api/hello
    timeout_seconds: 60
  adapter: compose

probes:
  - type: api
    name: "hello endpoint"
    requests:
      - method: GET
        path: /api/hello
    diff:
      against: base_branch
      ignore_fields:
        - "requests[*].response.body.timestamp"

  - type: api
    name: "user API routes"
    requests:
      - method: GET
        path: /api/users
      - method: GET
        path: /api/users/1
      - method: GET
        path: /api/users/999  # Test 404 handling
      - method: POST
        path: /api/users
        body:
          name: "Test User"
          email: "test@example.com"
          role: "user"
    diff:
      against: base_branch
      ignore_fields:
        - "requests[*].response.body.timestamp"
        - "requests[*].response.body.user.id"

  - type: api
    name: "search endpoint"
    requests:
      - method: POST
        path: /api/search
        body:
          query: "next"
          limit: 5
    diff:
      against: base_branch
      ignore_fields:
        - "requests[*].response.body.timestamp"
